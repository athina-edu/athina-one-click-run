events {

}

http {
  client_max_body_size 20m;
  include mime.types;

  # Plain HTTP on port 80.
  #
  # This used to share the TLS listener, so port 80 served the whole application.
  # That was worse than it looks: the proxy hardcodes `X-Forwarded-Proto https`
  # (added in d61075c to stop a redirect loop), so Django believed plain-HTTP
  # requests were already secure — SECURE_SSL_REDIRECT never fired and the Secure
  # session cookie was still sent. Credentials could be submitted in cleartext.
  #
  # Now: browsers are redirected to HTTPS, but the grading daemon keeps its
  # plain-HTTP access to the API. The daemon cannot use TLS — the certificate is
  # self-signed, so request_url's default verify=True raises SSLError — and it
  # talks to 172.29.1.1 over the internal compose network, which never leaves the
  # host. So the API location is reachable only from that network.
  server {
    listen 80;
    server_name 127.0.0.1 140.160.140.130;

    # The daemon polls this from 172.29.1.3 inside athina_net.
    #
    # The mask must be /32 for the specific container, not /16: the host reaches
    # nginx through a Docker bridge address that also sits in 172.29.x.x, so a
    # /16 would let the whole outside world through and defeat the rule.
    location /assignments/api/ {
      allow 172.29.1.3/32;
      deny all;

      proxy_pass http://athina-web:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Needed for the internal call to be served at all: without it Django's
      # SECURE_SSL_REDIRECT bounces it, which is the loop d61075c fixed. Safe
      # here because only the daemon container can reach this location.
      proxy_set_header X-Forwarded-Proto https;
      proxy_redirect off;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    listen 8000 ssl;  # Legacy port for typical wysig python django apps
    server_name 127.0.0.1 140.160.140.130;

    ssl_certificate /etc/certs/athinaweb.crt;
    ssl_certificate_key /etc/certs/athinaweb.key;

    location /static/ {
      # autoindex exposed a browsable listing of the collected static tree, which
      # is not needed to serve the known asset paths Django references.
      autoindex off;
      alias /code/static_files/;
    }

    location / {
      proxy_pass http://athina-web:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Correct here: this block only ever serves TLS.
      proxy_set_header X-Forwarded-Proto https;
      proxy_redirect off;
    }

  }
}


