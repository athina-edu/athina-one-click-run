events {

}

http {
  client_max_body_size 20m;
  include mime.types;

  # Plain HTTP on port 80.
  #
  # This MUST keep serving the app. The domain sits behind Cloudflare, which
  # fetches the origin over HTTP when its SSL mode is "Flexible" (the mode this
  # deployment works in, given the origin certificate is self-signed with no
  # SAN). An unconditional redirect here creates an infinite loop:
  #
  #   visitor -> https://athina.tsikerdekis.com      -> Cloudflare
  #   Cloudflare -> http://origin/                   -> this block
  #   this block -> 301 https://athina.tsikerdekis.com/
  #   Cloudflare -> http://origin/                   -> ... forever
  #
  # So no redirect here. The way to close the cleartext hop is on Cloudflare:
  # install a Cloudflare Origin CA certificate on the origin, set SSL mode to
  # "Full (strict)", and only then re-enable `return 301 https://...`.
  # Until that is done, redirecting here only breaks access.
  server {
    listen 80;
    server_name 127.0.0.1 140.160.140.130 athina.tsikerdekis.com;

    location /static/ {
      # autoindex exposed a browsable listing of the collected static tree, which
      # is not needed to serve the known asset paths Django references.
      autoindex off;
      alias /code/static_files/;
    }

    location / {
      proxy_pass http://athina-web:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Required: Django's SECURE_SSL_REDIRECT is on, so a request that looks
      # like plain HTTP is bounced (that was the d61075c redirect loop).
      proxy_set_header X-Forwarded-Proto https;
      proxy_redirect off;
    }
  }

  server {
    listen 443 ssl;
    listen 8000 ssl;  # Legacy port for typical wysig python django apps
    server_name 127.0.0.1 140.160.140.130 athina.tsikerdekis.com;

    ssl_certificate /etc/certs/athinaweb.crt;
    ssl_certificate_key /etc/certs/athinaweb.key;

    location /static/ {
      autoindex off;
      alias /code/static_files/;
    }

    location / {
      proxy_pass http://athina-web:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_redirect off;
    }

  }
}


